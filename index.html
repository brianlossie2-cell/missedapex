<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="MissedApex.css?v=1.1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missed Apex B.V. Spa 24</title>
    <link rel="stylesheet" href="MissedApex.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero-section">
        <div class="overlay"></div>
        <div class="hero-content">
            <img src="spa-logo.png" alt="iRacing Spa 24 Logo" class="logo">
            
            <h1 class="team-name">MISSED APEX B.V.</h1>
            <div class="countdown-box">
                <span class="timer" id="countdown-timer">00:00:00:00</span>
            </div>
            <h2 class="countdown-title" id="countdown-label">LADEN...</h2>
        </div>
    </header>

    <div class="live-stream-trigger">
        <a href="#streams" class="live-link">
            <span class="live-dot"></span>Kijk <span class="live-text-bold">LIVE</span> mee
        </a>
    </div>

    <main class="schedule-section">
        <h1 class="main-title">LINE-UP SCHEMA</h1>

        <div class="filter-container">
            <label for="name-filter" class="filter-label">Filter</label>
            <select id="name-filter" class="filter-select">
                <option value="ALL">Toon iedereen</option>
                </select>
        </div>

        <div class="lineup-table">
            <div class="table-header">
                <div class="table-cell left">
                    <h3 class="column-title driver-title">DRIVERS</h3>
                </div>
                <div class="empty-middle"></div>
                <div class="table-cell right">
                    <h3 class="column-title spotter-title">SPOTTERS</h3>
                </div>
            </div>

            <div class="table-row current-section">
                <div class="table-cell left" id="current-driver-container"></div>
                <div class="table-cell middle">
                    <div class="status-label-current">CURRENT</div>
                </div>
                <div class="table-cell right" id="current-spotter-container"></div>
            </div>

            <div class="table-row next-up-section">
                <div class="table-cell left" id="upcoming-drivers-container"></div>
                <div class="table-cell middle">
                    <div class="status-label-next">NEXT UP</div>
                </div>
                <div class="table-cell right" id="upcoming-spotters-container"></div>
            </div>
        </div>
    </main>

    <section id="streams" class="twitch-section">
        <h2 class="twitch-title">
            <span class="live-dot header-dot"></span>Kijk <span class="live-text-bold header-live-text">LIVE</span> mee
        </h2>
        <div class="streamers-container">
            
            <a href="https://twitch.tv/brianlossie" target="_blank" class="streamer-card-link">
                <div class="avatar-wrapper">
                    <img src="BrianPFP.png" alt="Streamer 1" class="streamer-avatar">
                </div>
                <span class="streamer-name">BrianLossie</span>
            </a>

            <a href="https://twitch.tv/duncan" target="_blank" class="streamer-card-link">
                <div class="avatar-wrapper">
                    <img src="DuncanPFP.png" alt="Streamer 2" class="streamer-avatar">
                </div>
                <span class="streamer-name">Duncan</span>
            </a>

            <a href="https://twitch.tv/stijn1710" target="_blank" class="streamer-card-link">
                <div class="avatar-wrapper">
                    <img src="StijnPFP.png" alt="Streamer 3" class="streamer-avatar">
                </div>
                <span class="streamer-name">Stijn1710</span>
            </a>

             <a href="https://twitch.tv/timdenheijer" target="_blank" class="streamer-card-link">
                <div class="avatar-wrapper">
                    <img src="TimPFP.png" alt="Streamer 3" class="streamer-avatar">
                </div>
                <span class="streamer-name">Timdenheijer</span>
            </a>

        </div>
    </section>

    <script>
        // --- CONFIGURATIE DATA ---
        const startKwalificatie = new Date("2026-07-11T14:30:00").getTime();
        const raceStartDatum = new Date("2026-07-11T14:50:00"); 
        const eindeRace         = new Date("2026-07-12T14:50:00").getTime();
        const startRace         = raceStartDatum.getTime(); 

        let csvData = "";

        fetch('iRacing 24H Spa 10-12 Juli 2026 - Rijdschema.csv')
            .then(response => {
                if (!response.ok) throw new Error("Kan rijdschema.csv niet vinden.");
                return response.text();
            })
            .then(text => {
                csvData = text;
                bouwNaamFilter();
                updateSchedule();
            })
            .catch(error => {
                console.error("Fout bij inladen CSV:", error);
                document.getElementById('current-driver-container').innerHTML = "Geen rijdschema.csv gevonden.";
            });

        function updateTimer() {
            const nu = new Date().getTime();
            const timerElement = document.getElementById("countdown-timer");
            const labelElement = document.getElementById("countdown-label");

            let doeltijd, statusTekst, toonDagen = false;

            if (nu < startKwalificatie) {
                doeltijd = startKwalificatie; statusTekst = "TOT KWALIFICATIE"; toonDagen = true;
            } else if (nu >= startKwalificatie && nu < startRace) {
                doeltijd = startRace; statusTekst = "KWALIFICATIE";
            } else if (nu >= startRace && nu < eindeRace) {
                doeltijd = eindeRace; statusTekst = "RACE";
            } else {
                labelElement.innerText = "RACE GEFINISHT"; timerElement.innerText = "00:00:00"; return;
            }

            const verschil = doeltijd - nu;
            const dagen = Math.floor(verschil / (1000 * 60 * 60 * 24));
            const uren = Math.floor((verschil % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minuten = Math.floor((verschil % (1000 * 60 * 60)) / (1000 * 60));
            const seconden = Math.floor((verschil % (1000 * 60)) / 1000);

            const dStr = dagen < 10 ? "0" + dagen : dagen;
            const hStr = uren < 10 ? "0" + uren : uren;
            const mStr = minuten < 10 ? "0" + minuten : minuten;
            const sStr = seconden < 10 ? "0" + seconden : seconden;

            labelElement.innerText = statusTekst;
            timerElement.innerText = toonDagen ? `${dStr}:${hStr}:${mStr}:${sStr}` : `${hStr}:${mStr}:${sStr}`;
        }

        function parseScheduleCSV(csvText) {
            if (!csvText) return { drivers: [], spotters: [] };
            
            let rawLines = csvText.split('\n').map(line => line.trim()).filter(line => line !== "");
            
            let driverHeaders = [];
            let spotterHeaders = [];
            let drivers = [];
            let spotters = [];
            let isSpotterSection = false;

            rawLines.forEach(lineStr => {
                const row = lineStr.split(',').map(item => item.trim());
                if (!row || row.length < 2 || row[0] === "") return;
                
                if (row[0] === "DRIVER") {
                    driverHeaders = row.slice(1).filter(h => h !== "");
                    isSpotterSection = false;
                    return;
                } else if (row[0] === "SPOTTER") {
                    spotterHeaders = row.slice(1).filter(h => h !== "");
                    isSpotterSection = true;
                    return;
                }

                const name = row[0];
                const shifts = row.slice(1);
                const activeHeaders = isSpotterSection ? spotterHeaders : driverHeaders;

                let huidigeDatum = new Date(raceStartDatum);
                let vorigStartUur = -1;

                shifts.forEach((val, index) => {
                    if (!activeHeaders[index]) return;

                    const timeRange = activeHeaders[index];
                    const timeParts = timeRange.split('-');
                    if (timeParts.length !== 2) return;

                    const [startTimeStr, endTimeStr] = timeParts.map(t => t.trim());
                    const [startH, startM] = startTimeStr.split(':').map(Number);
                    const [endH, endM] = endTimeStr.split(':').map(Number);

                    if (vorigStartUur !== -1 && startH < vorigStartUur) {
                        huidigeDatum.setDate(huidigeDatum.getDate() + 1);
                    }
                    vorigStartUur = startH;

                    if (val.toUpperCase() === 'X') {
                        const exactStart = new Date(huidigeDatum.getFullYear(), huidigeDatum.getMonth(), huidigeDatum.getDate(), startH, startM, 0).getTime();
                        
                        let eindDatum = new Date(huidigeDatum);
                        if (endH < startH || (endH === startH && endM < startM)) {
                            eindDatum.setDate(eindDatum.getDate() + 1);
                        }
                        const exactEnd = new Date(eindDatum.getFullYear(), eindDatum.getMonth(), eindDatum.getDate(), endH, endM, 0).getTime();

                        const entry = { 
                            name: name, 
                            startTimeText: startTimeStr, 
                            endTimeText: endTimeStr, 
                            exactStart: exactStart, 
                            exactEnd: exactEnd 
                        };
                        
                        if (isSpotterSection) spotters.push(entry); else drivers.push(entry);
                    }
                });
            });

            return { drivers, spotters };
        }

        function bouwNaamFilter() {
            const { drivers, spotters } = parseScheduleCSV(csvData);
            const filterDropdown = document.getElementById('name-filter');
            if (!filterDropdown) return;
            
            let uniekeNamen = new Set();
            drivers.forEach(d => uniekeNamen.add(d.name));
            spotters.forEach(s => uniekeNamen.add(s.name));
            
            let gesorteerdeNamen = Array.from(uniekeNamen).sort();
            
            gesorteerdeNamen.forEach(naam => {
                const optie = document.createElement('option');
                optie.value = naam;
                
                const geformatteerdeNaam = naam.charAt(0).toUpperCase() + naam.slice(1).toLowerCase();
                optie.innerText = geformatteerdeNaam;
                
                filterDropdown.appendChild(optie);
            });
            
            filterDropdown.addEventListener('change', updateSchedule);
        }

        function updateSchedule() {
            const { drivers, spotters } = parseScheduleCSV(csvData);
            const nu = new Date().getTime(); 

            const filterDropdown = document.getElementById('name-filter');
            const geselecteerdeNaam = filterDropdown ? filterDropdown.value : "ALL";

            const sorteerChronologisch = (a, b) => a.exactStart - b.exactStart;
            drivers.sort(sorteerChronologisch);
            spotters.sort(sorteerChronologisch);

            const currentDriverBox = document.getElementById('current-driver-container');
            const currentSpotterBox = document.getElementById('current-spotter-container');
            const upcomingDriversBox = document.getElementById('upcoming-drivers-container');
            const upcomingSpottersBox = document.getElementById('upcoming-spotters-container');

            currentDriverBox.innerHTML = "";
            currentSpotterBox.innerHTML = "";
            upcomingDriversBox.innerHTML = "";
            upcomingSpottersBox.innerHTML = "";

            let currentDriverFound = false;
            drivers.forEach(d => {
                if (nu >= d.exactStart && nu < d.exactEnd && !currentDriverFound) {
                    currentDriverBox.innerHTML = `
                        <div class="driver-card current">
                            <span class="person-name">${d.name}</span>
                            <span class="person-time">${d.startTimeText} - ${d.endTimeText}</span>
                        </div>`;
                    currentDriverFound = true;
                }
            });

            if (!currentDriverFound) {
                currentDriverBox.innerHTML = `<div class="driver-card current" style="background-color: #1a1a1a; color: #888;"><span class="person-name">Geen actieve driver</span><span class="person-time">--:--</span></div>`;
            }

            let upcomingDriversCount = 0;
            drivers.forEach(d => {
                if (d.exactStart >= nu) {
                    if (geselecteerdeNaam === "ALL" || d.name === geselecteerdeNaam) {
                        upcomingDriversBox.innerHTML += `
                            <div class="driver-card upcoming">
                                <span class="person-name-next">${d.name}</span>
                                <span class="person-time-next">${d.startTimeText} - ${d.endTimeText}</span>
                            </div>`;
                        upcomingDriversCount++;
                    }
                }
            });

            if (upcomingDriversCount === 0) {
                upcomingDriversBox.innerHTML = `
                    <div class="driver-card upcoming empty-schedule-balk">
                        <span class="person-name-next">Geen komende drivers</span>
                        <span class="person-time-next">--:--</span>
                    </div>`;
            }

            let currentSpotterFound = false;
            spotters.forEach(s => {
                if (nu >= s.exactStart && nu < s.exactEnd && !currentSpotterFound) {
                    currentSpotterBox.innerHTML = `
                        <div class="spotter-card current">
                            <span class="person-name">${s.name}</span>
                            <span class="person-time">${s.startTimeText} - ${s.endTimeText}</span>
                        </div>`;
                    currentSpotterFound = true;
                }
            });

            if (!currentSpotterFound) {
                currentSpotterBox.innerHTML = `<div class="spotter-card current" style="background-color: #1a1a1a; color: #888;"><span class="person-name">Geen actieve spotter</span><span class="person-time">--:--</span></div>`;
            }

            let upcomingSpottersCount = 0;
            spotters.forEach(s => {
                if (s.exactStart >= nu) {
                    if (geselecteerdeNaam === "ALL" || s.name === geselecteerdeNaam) {
                        upcomingSpottersBox.innerHTML += `
                            <div class="spotter-card upcoming">
                                <span class="person-name-next">${s.name}</span>
                                <span class="person-time-next">${s.startTimeText} - ${s.endTimeText}</span>
                            </div>`;
                        upcomingSpottersCount++;
                    }
                }
            });

            if (upcomingSpottersCount === 0) {
                upcomingSpottersBox.innerHTML = `
                    <div class="spotter-card upcoming empty-schedule-balk">
                        <span class="person-name-next">Geen komende spotters</span>
                        <span class="person-time-next">--:--</span>
                    </div>`;
            }
        }

        updateTimer();
        setInterval(() => {
            updateTimer();
            updateSchedule();
        }, 1000);
    </script>
</body>
</html>
